<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雨课堂自动学习 · 设置</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #eef3ff 0%, #f7f9fc 55%, #eaf0fb 100%);
    color: #1f2430;
  }
  .card {
    width: 640px; max-width: calc(100vw - 48px); background: #fff; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(31, 58, 120, .12); padding: 30px 34px 26px;
  }
  h1 { margin: 0 0 6px; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(180deg, #4a7dff, #1a3aa8); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: 13px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border: 1px solid #d8deea; border-radius: 8px;
    font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color: #4a7dff; box-shadow: 0 0 0 3px rgba(74,125,255,.14); }
  .hint { color: #8a93a5; font-size: 12px; margin-top: 6px; }
  .platform {
    display: flex; align-items: center; gap: 8px; margin-top: 18px;
    padding: 10px 12px; border: 1px solid #e2e8f4; border-radius: 9px; background: #f7f9ff;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34a853; flex: none; }
  .purl { font-family: Consolas, monospace; font-size: 13px; color: #2b3a55; }
  .ptag {
    margin-left: auto; font-size: 11px; color: #4a7dff; background: #e8efff;
    border-radius: 20px; padding: 2px 10px;
  }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
  select {
    width: 100%; padding: 10px 12px; border: 1px solid #d8deea; border-radius: 8px;
    font-size: 13px; background: #fff; outline: none;
  }
  .actions { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
  button {
    padding: 11px 22px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600;
    color: #fff; cursor: pointer; background: linear-gradient(180deg, #4a7dff, #2f5ce0);
    box-shadow: 0 4px 12px rgba(47,92,224,.25);
  }
  button:active { transform: translateY(1px); }
  button.ghost {
    background: #fff; color: #4a5568; border: 1px solid #d8deea; box-shadow: none; font-weight: 500;
  }
  .warn {
    margin-top: 18px; padding: 10px 12px; border-radius: 8px; font-size: 12px;
    background: #fff8e6; color: #8a6100; border: 1px solid #ffe3a3;
  }
  .err { color: #d93025; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1><span class="logo">学</span>雨课堂自动学习</h1>
    <div class="sub">「四有导师学院」是全国统一的平台入口，所有学校共用一个网址；你在哪个学校、哪个培训班，由你的账号决定。</div>

  <div class="platform">
    <span class="dot"></span>
    <span class="purl">acgecfd.yuketang.cn</span>
    <span class="ptag">统一入口</span>
  </div>

    <div class="row">
      <div>
        <label for="rate">播放倍速</label>
        <select id="rate">
          <option value="1">1.0 倍（最保守）</option>
          <option value="1.25">1.25 倍</option>
          <option value="1.5">1.5 倍</option>
          <option value="2" selected>2.0 倍（推荐，平台上限）</option>
        </select>
      </div>
      <div>
        <label for="login">登录态</label>
        <select id="login">
          <option value="0" selected>本次不保存（退出即清除）</option>
          <option value="1">记住登录，下次免登录</option>
        </select>
      </div>
    </div>

    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" id="go">开始刷课</button>
      <button type="button" class="ghost" id="cancel">取消</button>
      <button type="button" class="ghost" id="quit">退出</button>
    </div>

    <div class="warn">
      仅供个人学习与自动化技术研究：请确认平台服务条款允许此类操作，账号风险自负。
      是否完成学时最终由平台判定，不要用它代替真正的学习。
    </div>
  </form>

<script>
  const $ = (id) => document.getElementById(id);
  const err = $("err");

  // 上次的倍速回填（Rust 侧把 __RATE__ 换成实际值）
  (function () {
    const wanted = Number("__RATE__");
    if (!wanted) return;
    const sel = $("rate");
    let best = null, diff = 1e9;
    for (const opt of sel.options) {
      const d = Math.abs(parseFloat(opt.value) - wanted);
      if (d < diff) { diff = d; best = opt; }
    }
    if (best) sel.value = best.value;
  })();

  // 平台地址由 Rust 侧注入；页面不展示输入框，避免用户以为要自己找地址
  const PLATFORM_URL = "__PREFILL__";

  function start() {
    if (!/^https?:\/\//i.test(PLATFORM_URL)) {
      err.textContent = "内部地址缺失，请重新启动程序。";
      return;
    }
    err.textContent = "";
    const payload = {
      action: "start",
      url: PLATFORM_URL,
      rate: parseFloat($("rate").value) || 2,
      keepLogin: $("login").value === "1",
    };
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(payload);
    }
  }

  // 按钮是 type=button，必须直接绑 click；绑在 form 的 submit 上不会触发
  $("go").addEventListener("click", start);
  // 回车也走同一条路（表单默认提交被拦掉）
  $("f").addEventListener("submit", (ev) => {
    ev.preventDefault();
    start();
  });

  $("quit").addEventListener("click", () => {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage({ action: "quit" });
    }
  });

  // 中途从菜单打开设置页时才有"取消"（首次启动时由 Rust 侧隐藏）
  $("cancel").style.display = "__CANCEL_DISPLAY__";
  $("cancel").addEventListener("click", () => {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage({ action: "cancel" });
    }
  });
</script>
</body>
</html>
