[package]
name = "yuketang-autolearn"
version = "1.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "fs", "sync", "net", "io-util"] }
tokio-tungstenite = "0.30.0"
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
anyhow = "1.0"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.dev]
opt-level = 1

[build-dependencies]
winresource = "0.1"
